rules:
  # Custom
  - IP-CIDR,198.13.57.54/32,DIRECT,no-resolve
  - IP-CIDR,139.180.209.160/32,DIRECT,no-resolve
  - DOMAIN-SUFFIX,cuhk.edu.cn,DIRECT

  # Private
  - RULE-SET,private,Private
  - RULE-SET,private_ip,Private-IP,no-resolve

  # Maintenance: keep time sync, DoH endpoints, speed tests and IP probes local
  - RULE-SET,ntp,DIRECT
  - RULE-SET,doh,DIRECT
  - RULE-SET,speedtest,DIRECT
  - RULE-SET,ip_geo_detect,DIRECT
  - RULE-SET,stun,DIRECT
  - RULE-SET,ddns,DIRECT

  # Ads
  - RULE-SET,ads,Ads
  - RULE-SET,ads_telemetry,Ads

  # ------------------------------------------------------------
  # Development
  # ------------------------------------------------------------

  # Copilot is AI traffic, so it must match before the general GitHub set.
  - RULE-SET,github_copilot,Microsoft-AI
  - RULE-SET,github,GitHub
  - RULE-SET,dev,Development

  # ------------------------------------------------------------
  # AI：比 Google / Microsoft 大集合优先
  # ------------------------------------------------------------

  - RULE-SET,openai,OpenAI
  - RULE-SET,anthropic,Anthropic
  - RULE-SET,google_gemini,Google-AI
  - RULE-SET,xai,Other-AI
  - RULE-SET,huggingface,Other-AI
  - RULE-SET,bytedance_ai,Other-AI
  - RULE-SET,ai_chat,Other-AI

  # DeepSeek is reachable from the mainland, so keep it on the CN group.
  - RULE-SET,deepseek,CN

  - DOMAIN-SUFFIX,copilot.microsoft.com,Microsoft-AI
  - DOMAIN-SUFFIX,m365.cloud.microsoft,Microsoft-AI

  # ------------------------------------------------------------
  # Google / GoogleFCM / YouTube
  # ------------------------------------------------------------

  - RULE-SET,youtube,YouTube

  - RULE-SET,googlefcm,GoogleFCM

  - RULE-SET,google,Google
  - RULE-SET,google_ip,Google-IP,no-resolve

  # ------------------------------------------------------------
  # Microsoft
  # ------------------------------------------------------------

  - RULE-SET,microsoft_cn,Microsoft-CN
  - RULE-SET,onedrive,OneDrive
  - RULE-SET,xbox,Xbox
  - RULE-SET,microsoft,Microsoft

  # ------------------------------------------------------------
  # Apple
  # ------------------------------------------------------------

  - RULE-SET,apple_cn,Apple-CN
  - RULE-SET,apple_music,Apple-Music
  - RULE-SET,apple_music_cn,Apple-Music
  - RULE-SET,apple_tv,Apple
  - RULE-SET,apple_podcasts,Apple
  - RULE-SET,apple_dev,Apple
  - RULE-SET,apple_ai,Apple
  - RULE-SET,apple_pki,Apple
  - RULE-SET,apple_update,Apple
  - RULE-SET,apple,Apple

  # ------------------------------------------------------------
  # Content
  # ------------------------------------------------------------

  - RULE-SET,twitch,Twitch

  - RULE-SET,biliintl,BiliIntl
  - RULE-SET,bilibili_oversea,BiliIntl
  - RULE-SET,bilibili,Bilibili
  - RULE-SET,bilibili_cdn,Bilibili
  - RULE-SET,bilibili_game,Bilibili

  - RULE-SET,bahamut,Bahamut
  - RULE-SET,ehentai,EHentai
  - RULE-SET,pixiv,Pixiv

  - RULE-SET,media,Media

  # ------------------------------------------------------------
  # Communication / Social
  # ------------------------------------------------------------

  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram_ip,Telegram-IP,no-resolve

  - RULE-SET,twitter,Twitter
  - RULE-SET,twitter_ip,Twitter-IP,no-resolve

  - RULE-SET,discord,Discord
  - RULE-SET,social_media_cn,CN

  # ------------------------------------------------------------
  # Games
  # ------------------------------------------------------------

  - RULE-SET,steam_cn,Steam-CN
  - RULE-SET,games_cn,Games-CN
  - RULE-SET,games_category_cn,Games-CN
  - RULE-SET,steam,Steam
  - RULE-SET,games_category,Games
  - RULE-SET,games_oversea,Games

  # ------------------------------------------------------------
  # Storage / Utility
  # ------------------------------------------------------------

  - RULE-SET,netdisk_cn,CN
  - RULE-SET,netdisk_global,Non-CN
  - RULE-SET,scholar_cn,CN
  - RULE-SET,scholar_global,Non-CN
  - RULE-SET,cdn_cn,CN
  - RULE-SET,cdn_global,Non-CN
  - RULE-SET,pt,Non-CN
  - RULE-SET,remote_control,Remote-Control

  # ------------------------------------------------------------
  # 剩余 AI
  # 放在各平台专属规则之后
  # ------------------------------------------------------------

  - RULE-SET,ai_global,Other-AI

  # ------------------------------------------------------------
  # 通用分流
  # ------------------------------------------------------------

  - RULE-SET,geolocation_non_cn,Non-CN

  - RULE-SET,cn,CN
  - RULE-SET,cn_ip,CN-IP,no-resolve

  # IP-only fallbacks; Cloudflare/CloudFront/Fastly come last so that
  # streaming and social sets above keep their policy.
  - RULE-SET,ip_netflix,Media,no-resolve
