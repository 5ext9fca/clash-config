# Common Mihomo profile: terminal defaults; Nikki supplies router overrides.
# Preserves the original private nodes and Airport subscription credentials.
# Requires a Mihomo-based client with MRS and VLESS REALITY support.
# Terminal: enable the client service/VPN/TUN permission and let it manage DNS.
# Router: use Nikki TPROXY, disable TUN and DNS hijacking, and use redir-host.
# Router DNS: clients -> AGH:53 -> Mihomo 127.0.0.1:1053.
# Campus DNS 10.20.220.50 requires campus network/VPN reachability.
# Shared lists live in the x-proxy-lists and x-rule-provider anchors; Mihomo
# ignores unknown top-level keys, so they are pure YAML-side deduplication.

mode: rule
log-level: info
ipv6: false
allow-lan: false
mixed-port: 7897
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  # Keep this cross-platform profile free of Linux-specific redirect rules.
  auto-redirect: false
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

# Domain recovery is useful for router redir-host and cached DNS answers.
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.cuhk.edu.cn'
    - '+.lan'
    - '+.local'
    - 'Mijia Cloud'

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: false

  # Bootstrap DNS for resolvers; does not point back to the router's AGH.
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # Foreign/default resolution uses the currently selected PROXY group.
  nameserver:
    - 'https://1.1.1.1/dns-query#PROXY'
    - 'https://8.8.8.8/dns-query#PROXY'

  # Node hostnames must resolve without depending on the proxy itself.
  proxy-server-nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'

  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.cuhk.edu.cn'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'

  nameserver-policy:
    # Bootstrap the DIRECT Airport subscription without relying on proxy DNS.
    api.usfoo.com:
      - 'https://dns.alidns.com/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'
    '+.cuhk.edu.cn':
      - 10.20.220.50
    'rule-set:cn':
      - 'https://dns.alidns.com/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'

proxies:
  - name: "Vultr-JP"
    type: vless

    server: 198.13.57.54
    port: 443
    uuid: "4fc199d7-8e70-45b4-b18f-f3e45407e5c6"

    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: "www.mi.com"

    reality-opts:
      public-key: "J58F2aqvMjGi3SDmZIjwYY8wpAsxqbddtmUL5F0-xg0"
      short-id: "27bb3e8c080bf4de"

    client-fingerprint: chrome

  - name: "Vultr-SG"
    type: vless

    server: 139.180.209.160
    port: 443
    uuid: "4fc199d7-8e70-45b4-b18f-f3e45407e5c6"

    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: "www.mi.com"

    reality-opts:
      public-key: "J58F2aqvMjGi3SDmZIjwYY8wpAsxqbddtmUL5F0-xg0"
      short-id: "27bb3e8c080bf4de"

    client-fingerprint: chrome

proxy-providers:
  Airport:
    type: http
    interval: 86400
    url: "https://api.usfoo.com/api/v1/message?token=156b674d754416c212d668ebd3bc14d7"
    proxy: DIRECT
    path: ./proxy_providers/airport.yaml
    health-check:
      enable: true
      url: "https://www.youtube.com/generate_204"
      interval: 300
      timeout: 5000

# Shared candidate lists. Mihomo expands these before loading the
# profile, so each group below stays on a single line.
x-proxy-lists:
  proxied: &proxied [PROXY, AUTO, FALLBACK, Vultr-JP, Vultr-SG]
  proxied_quick: &proxied_quick [PROXY, AUTO, Vultr-JP, Vultr-SG]
  proxied_or_direct: &proxied_or_direct [PROXY, AUTO, FALLBACK, DIRECT]
  direct_first: &direct_first [DIRECT, PROXY]
  ai_nodes: &ai_nodes [Vultr-SG, Vultr-JP, PROXY, FALLBACK]

proxy-groups:
  # Manual selector. Only PROXY, AUTO and FALLBACK consume the Airport
  # provider; the remaining groups reference them, so the airport nodes are
  # listed and health-checked once instead of in every selector.
  - {name: PROXY, type: select, proxies: [AUTO, FALLBACK, Vultr-JP, Vultr-SG, DIRECT], use: [Airport]}
  - {name: AUTO, type: url-test, proxies: [Vultr-JP, Vultr-SG], use: [Airport], url: "https://www.youtube.com/generate_204", interval: 300, tolerance: 50, lazy: true}

  # FALLBACK 顺序代表优先级：
  - {name: FALLBACK, type: fallback, proxies: [Vultr-JP, Vultr-SG], use: [Airport], url: "https://www.youtube.com/generate_204", interval: 300, lazy: true}

  # ------------------------------------------------------------
  # Development
  # ------------------------------------------------------------
  - {name: Development, type: select, proxies: *proxied_or_direct}
  - {name: GitHub, type: select, proxies: [Development, PROXY, Vultr-JP, Vultr-SG, DIRECT]}

  # ------------------------------------------------------------
  # Google / GoogleFCM / YouTube
  # ------------------------------------------------------------
  - {name: Google, type: select, proxies: *proxied}
  - {name: Google-IP, type: select, proxies: [Google, PROXY, AUTO, Vultr-JP, Vultr-SG]}
  - {name: YouTube, type: select, proxies: *proxied}
  - {name: GoogleFCM, type: select, proxies: [Google, PROXY, AUTO, DIRECT]}

  # ------------------------------------------------------------
  # Microsoft
  # ------------------------------------------------------------
  # OneDrive keeps its own selector: bulk sync traffic is pinned separately.
  - {name: Microsoft, type: select, proxies: [DIRECT, PROXY, AUTO, FALLBACK, Vultr-JP, Vultr-SG]}
  - {name: OneDrive, type: select, proxies: [DIRECT, Microsoft, PROXY, AUTO]}

  # ------------------------------------------------------------
  # Apple
  # ------------------------------------------------------------
  - {name: Apple, type: select, proxies: [DIRECT, PROXY, AUTO, Vultr-JP, Vultr-SG]}

  # ------------------------------------------------------------
  # Content
  # ------------------------------------------------------------
  - {name: Twitch, type: select, proxies: *proxied_quick}
  - {name: Bilibili, type: select, proxies: *direct_first}
  - {name: BiliIntl, type: select, proxies: *proxied_quick}
  - {name: Bahamut, type: select, proxies: *proxied_quick}
  # 日区服务（Pixiv、EHentai）共用一个选择器。
  - {name: Japan, type: select, proxies: *proxied_quick}
  - {name: Media, type: select, proxies: *proxied_or_direct}

  # ------------------------------------------------------------
  # Communication / Social
  # ------------------------------------------------------------
  - {name: Telegram, type: select, proxies: *proxied}
  - {name: Telegram-IP, type: select, proxies: [Telegram, PROXY, AUTO, Vultr-JP, Vultr-SG]}
  - {name: Twitter, type: select, proxies: *proxied_quick}
  - {name: Twitter-IP, type: select, proxies: [Twitter, PROXY, AUTO]}
  - {name: Discord, type: select, proxies: *proxied}

  # ------------------------------------------------------------
  # AI
  # ------------------------------------------------------------
  # 除 Anthropic 外的 AI 流量共用一组；Anthropic 保留独立选择器。
  - {name: AI, type: select, proxies: *ai_nodes}
  - {name: Anthropic, type: select, proxies: *ai_nodes}

  # ------------------------------------------------------------
  # Games
  # ------------------------------------------------------------
  - {name: Games-CN, type: select, proxies: [DIRECT, Games, PROXY]}
  - {name: Games, type: select, proxies: [DIRECT, PROXY, AUTO, FALLBACK]}
  - {name: Steam-CN, type: select, proxies: [DIRECT, Steam, PROXY]}
  - {name: Steam, type: select, proxies: [DIRECT, Games, PROXY, AUTO]}

  # ------------------------------------------------------------
  # Utility / leftovers
  # ------------------------------------------------------------
  - {name: Ads, type: select, proxies: [REJECT, DIRECT]}
  - {name: Private, type: select, proxies: *direct_first}
  - {name: Private-IP, type: select, proxies: *direct_first}
  - {name: Remote-Control, type: select, proxies: *direct_first}

  # ------------------------------------------------------------
  # 通用分流
  # ------------------------------------------------------------
  - {name: Non-CN, type: select, proxies: [PROXY, AUTO, FALLBACK, Vultr-JP, Vultr-SG, DIRECT]}
  - {name: CN, type: select, proxies: *direct_first}
  - {name: CN-IP, type: select, proxies: *direct_first}
  - {name: MATCH, type: select, proxies: [PROXY, AUTO, FALLBACK, DIRECT, Vultr-JP, Vultr-SG]}

# Every rule set shares the same fetch settings; only behavior, path and
# url differ, so they are merged from this template.
