services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - type: bind
        source: ./settings.yaml
        target: /config/server/settings.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../MySubscription-Common.yaml
        target: /config/MySubscription-Common.yaml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # A 404 proves the HTTP worker is ready without fetching any subscription.
      test: [CMD, python, -c, "import http.client; c=http.client.HTTPConnection('127.0.0.1',8080,timeout=3); c.request('GET','/'); assert c.getresponse().status == 404"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CONFIG_DOMAIN: ${CONFIG_DOMAIN:?Set CONFIG_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
