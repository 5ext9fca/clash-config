# Paths are relative to this file. Restart the service after changing settings.
common: ../MySubscription-Common.yaml
private_nodes_mixin: ../Private-Nodes-Mixin.yaml
subscription_mixin: ../Subscription-Mixin.yaml
router_mixin: ../Nikki-Mixin.yaml
# Leave empty to use Subscription-Mixin's Airport URL. The provider must authorize this
# server before access; a denied request is never bypassed or converted.
upstream_url: ""
# Defaults used when forwarding is disabled or the client header is empty.
upstream_user_agent: FlClash/v0.9.2 clash-verge Platform/linux
upstream_flag: anytls
cache_ttl: 300
max_stale: 86400
retry_interval: 60
timeout: 15
devices:
  - name: desktop
    type: desktop
    forward_user_agent: true
    forward_flag: true
    token: REPLACE_WITH_A_RANDOM_DESKTOP_TOKEN
  - name: phone
    type: mobile
    forward_user_agent: true
    forward_flag: true
    token: REPLACE_WITH_A_RANDOM_MOBILE_TOKEN
  - name: router
    type: router
    forward_user_agent: false
    forward_flag: false
    token: REPLACE_WITH_A_RANDOM_ROUTER_TOKEN
