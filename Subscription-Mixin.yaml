# Subscription-specific overlay for MySubscription-Common.yaml.
# Deep-merge this mapping into Common before applying Nikki-Mixin.yaml.
# Preserve existing DNS policies; do not replace the nameserver-policy map.
# Only provider nodes are consumed from the remote subscription.

proxy-providers:
  Airport:
    type: http
    interval: 86400
    url: "https://api.usfoo.com/api/v1/message?token=156b674d754416c212d668ebd3bc14d7"
    header:
      flag:
        - anytls
      User-Agent:
        - FlClash/v0.9.2 clash-verge Platform/linux
    proxy: DIRECT
    path: ./proxy_providers/airport.yaml
    health-check:
      enable: true
      lazy: false
      url: "https://www.youtube.com/generate_204"
      interval: 300
      timeout: 5000

dns:
  # Use the provider's ingress-aware DNS for default and node resolution.
  # Lists race concurrently: never mix public resolvers into the primary list.
  nameserver:
    - 'https://zone.rlose.com:39933/api-query#DIRECT'
    - 'https://radar.rlose.com/api-query#DIRECT'
  # A dedicated proxy resolver bypasses fallback; inherit the main resolver.
  proxy-server-nameserver: []
  fallback:
    - 'https://dns.alidns.com/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  # Prefetch backup answers so an official timeout cannot exhaust their budget.
  # Successful official answers still take precedence over faster backups.
  fallback-lazy-query: false
  # Accept official answers regardless of location; fall back on failure/no IP.
  fallback-filter:
    geoip: false
    geosite: []
    ipcidr: []
    domain: []
  nameserver-policy:
    # Bootstrap the DIRECT Airport subscription without relying on proxy DNS.
    api.usfoo.com:
      - 'https://dns.alidns.com/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'
