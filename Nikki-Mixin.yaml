# Nikki router mixin for MySubscription-Common.yaml.
# Router: TCP+UDP TPROXY on 7893, IPv4 only, no TUN.
# DNS: clients -> AGH:53 -> Mihomo 127.0.0.1:1053.
# In Nikki proxy settings, disable BOTH IPv4 and IPv6 DNS hijacking.
# Enable router/LAN proxy and configure matching access-control rules.
# Server router subscriptions already include this mixin: disable duplicate
# Mixin File Content and set matching GUI mixin fields to Unmodified.
# For manual Common imports only, enable Mixin File Content with this file.
# Turn off list/map overwrite switches for DNS and sniffer settings.
# GUI options are applied AFTER this file, and can overwrite its values.
# The masked API secret in the screenshot cannot be recovered.
# A fresh API secret is supplied below; update the dashboard connection to it.
# Router explicit HTTP/SOCKS/mixed ports are disabled; terminal port stays 7897.
# Do not replace the main subscription profile with this overlay.
# Private node definitions live in Private-Nodes-Mixin.yaml; groups and rules stay in Common.
# Merge Private-Nodes-Mixin.yaml, then Subscription-Mixin.yaml into Common first.
# API TLS fields were Unmodified in the screenshot and are intentionally omitted.
#
# Nikki deep-merges this file over the profile, so only the values that differ
# from MySubscription-Common.yaml are listed. Everything else (DNS resolvers,
# fake-ip filter, nameserver policy, sniffer ports, store-selected) is inherited.

mode: rule
find-process-mode: 'off'

allow-lan: true
bind-address: '*'
port: 0
socks-port: 0
mixed-port: 0
redir-port: 0
tproxy-port: 7893

external-controller: 0.0.0.0:9090
secret: 43115781urso;
external-ui: ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip

profile:
  store-fake-ip: false

tun:
  enable: false
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
  dns-hijack: []

# redir-host is required because clients reach Mihomo through AGH.
dns:
  enhanced-mode: redir-host
