# Nikki router mixin for MySubscription-Common.yaml.
# Router: TCP+UDP TPROXY on 7893, IPv4 only, no TUN.
# DNS: clients -> AGH:53 -> Mihomo 127.0.0.1:1053.
# In Nikki proxy settings, disable BOTH IPv4 and IPv6 DNS hijacking.
# Enable router/LAN proxy and configure matching access-control rules.
# Enable Mixin File Content; set matching GUI mixin fields to Unmodified.
# Turn off list/map overwrite switches for DNS and sniffer settings.
# GUI options are applied AFTER this file, and can overwrite its values.
# The masked API secret in the screenshot cannot be recovered.
# A fresh API secret is supplied below; update the dashboard connection to it.
# Router explicit HTTP/SOCKS/mixed ports are disabled; terminal port stays 7897.
# Do not replace the main subscription profile with this overlay.
# Nodes, providers, proxy groups and routing rules stay in the main profile.
# API TLS fields were Unmodified in the screenshot and are intentionally omitted.

mode: rule
log-level: info
ipv6: false
find-process-mode: 'off'
unified-delay: true
tcp-concurrent: true
allow-lan: true
bind-address: '*'
port: 0
socks-port: 0
mixed-port: 0
redir-port: 0
tproxy-port: 7893
external-controller: 0.0.0.0:9090
secret: 43115781urso;
external-ui: ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
profile:
  store-selected: true
  store-fake-ip: false
tun:
  enable: false
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
  dns-hijack: []
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: redir-host
  fake-ip-range: 198.18.0.1/16
  respect-rules: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query#PROXY
    - https://8.8.8.8/dns-query#PROXY
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - +.cuhk.edu.cn
    - localhost.ptlogin2.qq.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
  nameserver-policy:
    api.usfoo.com:
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    +.cuhk.edu.cn:
      - 10.20.220.50
    rule-set:cn:
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - +.cuhk.edu.cn
    - +.lan
    - +.local
    - Mijia Cloud
